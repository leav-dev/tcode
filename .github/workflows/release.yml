name: release

# Builds tcode for the supported platforms on every v* tag and uploads the
# binaries plus a checksums.txt as GitHub release assets. The installers
# download them (scripts/install.sh, scripts/install.ps1).
#
# Preview versions use `preview-v*` tags (e.g. preview-v0.1.3) from the
# preview branch: they build the same assets but the GitHub release is
# marked as prerelease (stable users and `tcode update`, which reads
# releases/latest, never see them) and GoReleaser/homebrew is skipped.
# Never tag a preview as `v*-preview`: it would match `v*` and ship as
# a stable release.
on:
  push:
    tags:
      - 'v*'
      - 'preview-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/tcode-${{ matrix.target }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/leav-dev/tcode/internal/update.version=${{ github.ref_name }}" -o "$out" .
          sha256sum "$out" >> dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # Preview tags ship as prerelease so releases/latest (stable
          # users, installers, `tcode update`) never points at them.
          prerelease: ${{ startsWith(github.ref_name, 'preview-') }}

  release:
    # Stable only: GoReleaser parses the tag as semver (preview-v* is
    # not) and bumps the homebrew formula, which must track stable.
    if: ${{ !startsWith(github.ref_name, 'preview-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
